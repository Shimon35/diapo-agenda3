<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Diaporama — Les Champs Libres</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;

      background: #111;
      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      overflow: hidden;
    }


    /* -------------------------------------------------
       CONTENEUR PRINCIPAL
    ------------------------------------------------- */

    .page {

      width: 100vw;
      height: 100vh;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 35px;
    }


    .slide {

      width: 100%;
      height: 100%;

      max-width: 1500px;

      display: flex;

      flex-direction: column;

      justify-content: center;

    }


    /* -------------------------------------------------
       IMAGE
    ------------------------------------------------- */

    .image-container {

      width: 100%;

      height: 62vh;

      background: #000;

      border-radius: 10px;

      overflow: hidden;

      display: flex;

      align-items: center;
      justify-content: center;

      box-shadow:
        0 10px 40px
        rgba(0,0,0,0.6);
    }


    #event-image {

      width: 100%;
      height: 100%;

      object-fit: cover;

      display: none;

      transition:
        opacity 0.4s ease;
    }


    #no-image {

      color: #666;

      font-size: 25px;

      display: none;
    }


    /* -------------------------------------------------
       INFORMATIONS
    ------------------------------------------------- */

    .information {

      margin-top: 22px;

      padding: 20px 25px;

      background:
        rgba(0,0,0,0.78);

      border-radius: 10px;
    }


    #event-title {

      margin: 0 0 10px 0;

      font-size:
        clamp(
          28px,
          3.5vw,
          52px
        );

      line-height: 1.1;
    }


    #event-date {

      font-size:
        clamp(
          20px,
          2vw,
          30px
        );

      color: #ddd;

      margin-bottom: 8px;
    }


    #event-location {

      font-size: 18px;

      color: #aaa;

      margin-bottom: 12px;
    }


    #event-description {

      font-size: 20px;

      line-height: 1.4;

      color: #eee;

      max-width: 1100px;

      max-height: 115px;

      overflow: hidden;
    }


    /* -------------------------------------------------
       INFORMATIONS TECHNIQUES
    ------------------------------------------------- */

    #status {

      position: fixed;

      bottom: 10px;
      left: 15px;

      font-size: 12px;

      color: #666;

      background:
        rgba(0,0,0,0.7);

      padding: 6px 10px;

      border-radius: 4px;
    }


    #counter {

      position: fixed;

      bottom: 10px;
      right: 15px;

      font-size: 12px;

      color: #666;
    }


    /* -------------------------------------------------
       MODE PLEIN ÉCRAN
    ------------------------------------------------- */

    body.fullscreen {

      background: #000;
    }

  </style>

</head>


<body>


<div class="page">

  <main class="slide">


    <!-- IMAGE -->

    <div class="image-container">

      <img
        id="event-image"
        alt=""
      >

      <div id="no-image">
        Pas d'image disponible
      </div>

    </div>


    <!-- INFORMATIONS -->

    <div class="information">

      <h1 id="event-title">
        Chargement…
      </h1>


      <div id="event-date">
      </div>


      <div id="event-location">
      </div>


      <div id="event-description">
      </div>

    </div>


  </main>

</div>


<!-- Informations techniques -->

<div id="status">
  Chargement de l'agenda…
</div>


<div id="counter">
</div>


<script>


/* =====================================================
   PARAMÈTRES
===================================================== */


/*
   Le fichier agenda.json est maintenant
   automatiquement généré par GitHub Actions.
*/

const JSON_URL =
  "agenda.json";


/*
   Durée d'affichage d'une slide.

   8000 = 8 secondes
*/

const SLIDE_DURATION =
  8000;


/* =====================================================
   VARIABLES
===================================================== */

let events = [];

let currentIndex = 0;


/* =====================================================
   CHARGEMENT DU JSON
===================================================== */

async function loadAgenda() {

  try {

    /*
       Le ?timestamp empêche le navigateur
       d'utiliser une ancienne version du fichier.
    */

    const response = await fetch(
      JSON_URL + "?t=" + Date.now()
    );


    if (!response.ok) {

      throw new Error(
        "Erreur HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    events =
      data.events || [];


    console.log(
      "Nombre d'événements :",
      events.length
    );


    if (!events.length) {

      throw new Error(
        "Aucun événement trouvé."
      );

    }


    document.getElementById(
      "status"
    ).textContent =
      events.length +
      " événements chargés";


    /*
       Première slide
    */

    showEvent();


    /*
       Passage automatique
       à l'événement suivant.
    */

    setInterval(
      nextEvent,
      SLIDE_DURATION
    );


  }

  catch (error) {

    console.error(
      "Erreur :",
      error
    );


    document.getElementById(
      "event-title"
    ).textContent =
      "Erreur de chargement";


    document.getElementById(
      "event-description"
    ).textContent =
      error.message;


    document.getElementById(
      "status"
    ).textContent =
      "Erreur — voir la console";


  }

}


/* =====================================================
   AFFICHAGE D'UN ÉVÉNEMENT
===================================================== */

function showEvent() {

  const event =
    events[currentIndex];


  if (!event) {
    return;
  }


  console.log(
    "Affichage :",
    event.title?.fr
  );


  /*
     -----------------------------------------------
     TITRE
     -----------------------------------------------
  */

  const title =
    event.title?.fr ||
    event.title ||
    "";


  document.getElementById(
    "event-title"
  ).textContent =
    title;


  /*
     -----------------------------------------------
     DATE
     -----------------------------------------------
  */

  const start =
    event.start;


  const date =
    formatDate(start);


  const time =
    formatTime(start);


  let dateText =
    date;


  if (time) {

    dateText +=
      " — " +
      time;

  }


  document.getElementById(
    "event-date"
  ).textContent =
    dateText;


  /*
     -----------------------------------------------
     LIEU
     -----------------------------------------------
  */

  let location = "";


  if (
    event.location &&
    event.location.name
  ) {

    location =
      event.location.name;

  }


  document.getElementById(
    "event-location"
  ).textContent =
    location;


  /*
     -----------------------------------------------
     DESCRIPTION
     -----------------------------------------------
  */

  const description =
    event.description?.fr ||
    "";


  document.getElementById(
    "event-description"
  ).textContent =
    cleanText(description);


  /*
     -----------------------------------------------
     IMAGE
     -----------------------------------------------
  */

  displayImage(
    event.image
  );


  /*
     -----------------------------------------------
     COMPTEUR
     -----------------------------------------------
  */

  document.getElementById(
    "counter"
  ).textContent =

    (currentIndex + 1) +
    " / " +
    events.length;

}


/* =====================================================
   IMAGE
===================================================== */

function displayImage(url) {

  const image =
    document.getElementById(
      "event-image"
    );


  const noImage =
    document.getElementById(
      "no-image"
    );


  image.style.display =
    "none";


  noImage.style.display =
    "none";


  if (!url) {

    noImage.style.display =
      "block";

    return;

  }


  /*
     On attend que l'image soit
     réellement chargée.
  */

  image.onload =
    function() {

      image.style.display =
        "block";

    };


  image.onerror =
    function() {

      console.error(
        "Image impossible à charger :",
        url
      );


      noImage.style.display =
        "block";

    };


  image.src =
    url;

}


/* =====================================================
   NETTOYAGE DU TEXTE
===================================================== */

function cleanText(text) {

  if (!text) {
    return "";
  }


  const div =
    document.createElement(
      "div"
    );


  div.innerHTML =
    text;


  return div.textContent
    .replace(/\s+/g, " ")
    .trim();

}


/* =====================================================
   DATE
===================================================== */

function formatDate(value) {

  if (!value) {
    return "";
  }


  const date =
    new Date(value);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return value;

  }


  return date.toLocaleDateString(
    "fr-FR",
    {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    }
  );

}


/* =====================================================
   HEURE
===================================================== */

function formatTime(value) {

  if (!value) {
    return "";
  }


  const date =
    new Date(value);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return "";

  }


  return date.toLocaleTimeString(
    "fr-FR",
    {
      hour: "2-digit",
      minute: "2-digit"
    }
  );

}


/* =====================================================
   ÉVÉNEMENT SUIVANT
===================================================== */

function nextEvent() {

  if (!events.length) {
    return;
  }


  currentIndex++;


  if (
    currentIndex >=
    events.length
  ) {

    currentIndex = 0;

  }


  showEvent();

}


/* =====================================================
   LANCEMENT
===================================================== */

loadAgenda();


</script>


</body>

</html>
